<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' cc-media: blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' cc-media: blob: data: https: http:; media-src 'self' cc-media: blob:; connect-src 'self' cc-media: ws: wss: https:" />
    <title>ЦентрЧатов</title>
    <!-- v1.2.335: стартовая заставка. Стили встроены (CSP style-src 'unsafe-inline'), чтобы показаться
         мгновенно, до загрузки React-бандла. Убирается из src/main.jsx после первого кадра. -->
    <style>
      #cc-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(120% 90% at 50% 40%, #12203a 0%, #0a0e17 55%, #05070d 100%);
        color: #eaf1ff; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        transition: opacity .45s ease, visibility .45s ease;
      }
      #cc-splash.cc-splash--hide { opacity: 0; visibility: hidden; pointer-events: none; }
      .cc-splash__glow {
        position: absolute; width: 420px; height: 420px; border-radius: 50%;
        background: radial-gradient(circle, rgba(42,171,238,.28), transparent 60%);
        filter: blur(30px); animation: ccPulse 2.4s ease-in-out infinite;
      }
      .cc-splash__center {
        position: relative; text-align: center;
        display: flex; flex-direction: column; align-items: center; gap: 22px;
      }
      /* v1.2.443: знак приложения на стартовой заставке. Полосы «влетают» слева по очереди —
         это и есть признак «идёт загрузка», отдельная крутилка не нужна. */
      .cc-splash__mark { display: block; filter: drop-shadow(0 6px 18px rgba(56,189,248,.35)); }
      .cc-splash__mark .cc-bar { animation: ccBarIn 1.9s ease-in-out infinite; }
      .cc-splash__mark .cc-bar:nth-child(1) { animation-delay: 0s; }
      .cc-splash__mark .cc-bar:nth-child(2) { animation-delay: .16s; }
      .cc-splash__mark .cc-bar:nth-child(3) { animation-delay: .32s; }
      @keyframes ccBarIn {
        0%      { transform: translateX(-7px); opacity: .15; }
        35%     { transform: translateX(0);    opacity: 1; }
        70%     { transform: translateX(0);    opacity: 1; }
        100%    { transform: translateX(-7px); opacity: .15; }
      }
      .cc-splash__logo {
        font-size: 38px; font-weight: 800; letter-spacing: .5px;
        background: linear-gradient(90deg, #7fd0ff, #2aabee, #7f9cff);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: ccBreath 2.4s ease-in-out infinite;
      }
      .cc-splash__bar {
        width: 190px; height: 4px; border-radius: 4px;
        background: rgba(255,255,255,.08); overflow: hidden;
      }
      .cc-splash__bar span {
        display: block; width: 40%; height: 100%; border-radius: 4px;
        background: linear-gradient(90deg, transparent, #2aabee, #7fd0ff, transparent);
        animation: ccSweep 1.25s ease-in-out infinite;
      }
      .cc-splash__hint { font-size: 13px; color: rgba(234,241,255,.5); letter-spacing: .4px; }
      /* v1.2.406: кружки на стартовой заставке — те же, что на экране «загрузка чатов» → единый вид (один экран). */
      .cc-splash__circles { display: flex; gap: 14px; }
      .cc-splash__circles span { width: 44px; height: 44px; border-radius: 50%; animation: ccBounce 2.4s ease-in-out infinite; }
      .cc-splash__circles span:nth-child(1) { background: linear-gradient(135deg,#3aa76d,#1f7a4d); animation-delay: 0s; }
      .cc-splash__circles span:nth-child(2) { background: linear-gradient(135deg,#e0567a,#a5324f); animation-delay: .25s; }
      .cc-splash__circles span:nth-child(3) { background: linear-gradient(135deg,#3a7bd5,#2456a0); animation-delay: .5s; }
      .cc-splash__circles span:nth-child(4) { background: linear-gradient(135deg,#7d7bff,#4b49c9); animation-delay: .75s; }
      .cc-splash__circles span:nth-child(5) { background: linear-gradient(135deg,#e0973a,#a5651f); animation-delay: 1s; }
      @keyframes ccBounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes ccSweep { 0% { transform: translateX(-120%); } 100% { transform: translateX(360%); } }
      @keyframes ccPulse { 0%,100% { transform: scale(.9); opacity: .55; } 50% { transform: scale(1.08); opacity: .9; } }
      @keyframes ccBreath {
        0%,100% { opacity: .85; text-shadow: 0 0 18px rgba(42,171,238,.3); }
        50%     { opacity: 1;   text-shadow: 0 0 30px rgba(42,171,238,.55); }
      }
      @media (prefers-reduced-motion: reduce) {
        .cc-splash__glow, .cc-splash__logo, .cc-splash__circles span,
        .cc-splash__mark .cc-bar { animation: none; }
      }
      /* v1.2.452 — панель «нет связи» ПОВЕРХ заставки: показывается, если код приложения
         не догрузился (обрыв интернета в момент запуска). Живёт в index.html специально:
         ей не нужен ни один загружаемый файл, поэтому она работает даже тогда, когда
         не загрузилось вообще ничего. */
      #cc-boot-net {
        display: none; margin-top: 18px; max-width: 460px; padding: 16px 18px;
        border: 1px solid #7F3A3A; border-radius: 14px; background: #2A1518;
        box-shadow: 0 12px 34px rgba(0,0,0,.45); text-align: left;
      }
      #cc-boot-net.cc-on { display: block; }
      .cc-bn__title { font: 600 15px/1.3 system-ui, sans-serif; color: #F1F5F9; margin-bottom: 6px; }
      .cc-bn__why { font: 400 13px/1.45 system-ui, sans-serif; color: rgba(241,245,249,.72); }
      .cc-bn__row { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
      .cc-bn__left { font: 600 13px/1 system-ui, sans-serif; color: #F1F5F9; font-variant-numeric: tabular-nums; }
      .cc-bn__btn {
        margin-left: auto; padding: 7px 14px; border-radius: 8px; cursor: pointer;
        border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.1);
        color: #F1F5F9; font: 600 13px system-ui, sans-serif;
      }
      .cc-bn__btn:hover { background: rgba(255,255,255,.18); }
      .cc-bn__try { margin-top: 8px; font: 400 12px system-ui, sans-serif; color: rgba(241,245,249,.5); }
    </style>
  </head>
  <body>
    <div id="cc-splash" role="status" aria-label="Загрузка приложения">
      <div class="cc-splash__glow"></div>
      <div class="cc-splash__center">
        <!-- v1.2.443: знак приложения (тот же, что в трее и на иконке) -->
        <svg class="cc-splash__mark" width="76" height="76" viewBox="0 0 64 64" aria-hidden="true">
          <g fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round">
            <path class="cc-bar" d="M3 18 H17" />
            <path class="cc-bar" d="M3 32 H17" />
            <path class="cc-bar" d="M3 46 H17" />
          </g>
          <rect x="22" y="10" width="38" height="34" rx="11" fill="none" stroke="#ffffff" stroke-width="4.5" />
          <path d="M31 44 V57 L43 44 Z" fill="#ffffff" />
        </svg>
        <div class="cc-splash__logo">ЦентрЧатов</div>
        <div class="cc-splash__circles"><span></span><span></span><span></span><span></span><span></span></div>
        <div class="cc-splash__hint">Загрузка чатов…</div>
        <!-- v1.2.452: окно переподключения приложения (скрыто, пока всё хорошо) -->
        <div id="cc-boot-net" role="alert">
          <div class="cc-bn__title">Не удалось загрузить приложение</div>
          <div class="cc-bn__why" id="cc-bn-why"></div>
          <div class="cc-bn__row">
            <span class="cc-bn__left" id="cc-bn-left"></span>
            <button class="cc-bn__btn" id="cc-bn-btn" type="button">Повторить сейчас</button>
          </div>
          <div class="cc-bn__try" id="cc-bn-try"></div>
        </div>
      </div>
    </div>
    <!-- v1.2.452 — АВТО-ПЕРЕПОДКЛЮЧЕНИЕ САМОГО ПРИЛОЖЕНИЯ.
         Жалоба (11 сентября 2026): при обрыве интернета в момент запуска приложение
         навсегда зависало на заставке. По журналу видно ровно это: 14 файлов программы
         не догрузились с ошибкой ERR_NETWORK_CHANGED (сеть переключилась), а через 3 минуты
         предохранитель просто убрал заставку → пустое окно.
         Теперь окно переподключения поднимается САМО — как у мессенджеров.
         🔴 ПОЧЕМУ КОД ЗДЕСЬ, А НЕ В ОТДЕЛЬНОМ ФАЙЛЕ: среди не догрузившихся файлов был и
         shared/reconnectPlan.js. Значит этот код не может ничего у себя подключать — иначе
         упадёт вместе с остальным. index.html — сам документ, ему загружать нечего. -->
    <script>
      (function ccBootNet() {
        // Лестница пауз — те же числа, что у мессенджеров (shared/reconnectPlan.js).
        // Дублируются ОСОЗНАННО (см. комментарий выше); совпадение сторожит тест bootNet.vitest.js.
        var LADDER = [5000, 10000, 20000, 40000, 60000]
        var KEY = 'ccBootAttempt'   // номер попытки переживает перезагрузку окна
        var shown = false, tick = 0, dueAt = 0
        var netDown = false        // сеть пропала — не повод показывать окно, но повод уточнить причину

        function attemptNo() { try { return Number(sessionStorage.getItem(KEY)) || 0 } catch (e) { return 0 } }
        function pauseMs(n) { return LADDER[Math.min(Math.max(n, 0), LADDER.length - 1)] }
        function el(id) { return document.getElementById(id) }
        function say(m) { try { window.api && window.api.send && window.api.send('app:log', { level: 'WARN', message: '[boot-net] ' + m }) } catch (e) {} }

        function retryNow() {
          try { sessionStorage.setItem(KEY, String(attemptNo() + 1)) } catch (e) {}
          say('перезагружаю окно, попытка ' + (attemptNo() + 1))
          api.reload()
        }

        function paint() {
          var left = Math.max(0, Math.ceil((dueAt - Date.now()) / 1000))
          var l = el('cc-bn-left'); if (l) l.textContent = 'Повторим через ' + left + ' с'
          if (left <= 0) { clearInterval(tick); tick = 0; retryNow() }
        }

        // Причина для человека: если сети нет — скажем прямо, иначе общий текст.
        function whyLoadFailed() {
          return netDown || navigator.onLine === false
            ? 'нет связи с интернетом — часть программы не загрузилась'
            : 'часть программы не загрузилась — похоже, пропала связь'
        }

        function show(why) {
          if (shown) return
          // 🔴 v1.2.453 (находка ревью): флаг поднимаем ТОЛЬКО если панель реально на экране.
          // После успешного запуска заставку (вместе с панелью) убирают из окна — раньше флаг
          // вставал и тут, а потом возврат сети перезагружал РАБОТАЮЩЕЕ приложение.
          var box = el('cc-boot-net'); if (!box) return
          shown = true
          var n = attemptNo()
          el('cc-bn-why').textContent = why
          el('cc-bn-try').textContent = n > 0 ? ('Попытка ' + n + ' — программа пробует сама') : 'Программа пробует сама'
          box.classList.add('cc-on')
          var hint = document.querySelector('.cc-splash__hint'); if (hint) hint.textContent = 'Не удалось запуститься'
          dueAt = Date.now() + pauseMs(n)
          paint()
          tick = setInterval(paint, 1000)
          say('окно переподключения показано: ' + why + ' (попытка ' + n + ', пауза ' + pauseMs(n) / 1000 + 'с)')
        }

        // «Пульт» объявляем ДО слушателей: иначе обработчик мог сослаться на него раньше,
        // чем он создан (v1.2.453, находка ревью — хрупкое место).
        // api.reload — отдельным «швом», чтобы тест мог подменить перезагрузку окна.
        var api = {
          show: show, retryNow: retryNow, attemptNo: attemptNo, pauseMs: pauseMs, LADDER: LADDER,
          reload: function () { try { location.reload() } catch (e) {} },
          // Приложение запустилось — гасим отсчёт, обнуляем счётчик И СБРАСЫВАЕМ ФЛАГ.
          // 🔴 Флаг обязателен к сбросу: иначе после старта возврат сети перезагружал
          // РАБОТАЮЩЕЕ приложение (v1.2.453, находка ревью).
          ok: function () { clearInterval(tick); tick = 0; shown = false; try { sessionStorage.removeItem(KEY) } catch (e) {} },
        }
        window.__ccBootNet = api
        var b = el('cc-bn-btn'); if (b) b.addEventListener('click', function () { clearInterval(tick); tick = 0; retryNow() })

        // Сбой загрузки файла программы. Событие ресурса НЕ всплывает (MDN), поэтому
        // слушаем в фазе перехвата — третий параметр true.
        window.addEventListener('error', function (e) {
          var t = e && e.target
          if (!t || t === window || !t.tagName) return
          var tag = String(t.tagName).toUpperCase()
          if (tag === 'SCRIPT' || tag === 'LINK') show(whyLoadFailed())
        }, true)

        // Сорванная догрузка части программы приходит отказом обещания.
        window.addEventListener('unhandledrejection', function (e) {
          var m = String((e && e.reason && (e.reason.message || e.reason)) || '')
          if (/dynamically imported|Failed to fetch|Importing a module|NETWORK_CHANGED/i.test(m)) {
            show(whyLoadFailed())
          }
        })

        // 🔴 v1.2.453 (находка ревью): «нет сети» САМА ПО СЕБЕ окно НЕ поднимает.
        // Оболочка приложения грузится с диска, чаты есть в памяти — без интернета программа
        // обязана просто запуститься. Раньше отсутствие сети сразу запускало отсчёт до
        // перезагрузки, и приложение крутило перезагрузки вместо запуска (счётчик рос 1→2→3…).
        // Теперь отсутствие сети лишь УТОЧНЯЕТ причину, если случится настоящий сбой загрузки.
        window.addEventListener('offline', function () { netDown = true })
        window.addEventListener('online', function () {
          netDown = false
          // Перезагружаем только если окно ДЕЙСТВИТЕЛЬНО показано (панель на экране).
          var box = el('cc-boot-net')
          if (shown && box && box.classList.contains('cc-on')) { clearInterval(tick); tick = 0; retryNow() }
        })
        if (navigator.onLine === false) netDown = true

      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/boot-probe.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
