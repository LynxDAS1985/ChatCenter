<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-app-region: no-drag;
  }
  /* v1.2.70/75: подсказка задачи (Вариант 4). Отдельное «сквозное» окно
     (setIgnoreMouseEvents в main) — не ловит мышь и не ресайзит док. */
  .tt-card {
    position: relative;
    background: #1a1a2e;
    border: 1px solid rgba(99,102,241,0.3);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.55);
    overflow: hidden;
    color: #e2e8f0;
    padding: 11px 13px 11px 15px;
    max-width: 262px;
  }
  .tt-bar { position:absolute; left:0; top:0; bottom:0; width:3px; border-radius:10px 0 0 10px; background:#2AABEE; }
  /* v1.2.75: шапка — аватар + (отправитель / источник) */
  .tt-head { display:flex; align-items:center; gap:9px; margin-bottom:7px; }
  .tt-av { width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff; overflow:hidden; }
  .tt-av img { width:100%; height:100%; object-fit:cover; display:block; }
  .tt-hcol { display:flex; flex-direction:column; min-width:0; flex:1; }
  .tt-sender { font-size:12.5px; font-weight:700; color:#e2e8f0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tt-src { font-size:9px; color:rgba(165,180,252,0.8); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tt-catrow { margin-bottom:6px; }
  .tt-cat { font-size:9px; font-weight:700; padding:1px 7px; border-radius:5px; flex-shrink:0; display:none; }
  .tt-cat.urgent { color:#f87171; background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.45); }
  .tt-cat.work   { color:#fbbf24; background:rgba(245,158,11,0.15); border:1px solid rgba(245,158,11,0.45); }
  .tt-cat.later  { color:#4ade80; background:rgba(34,197,94,0.15); border:1px solid rgba(34,197,94,0.45); }
  .tt-text { font-size:12px; color:rgba(255,255,255,0.85); line-height:1.45; white-space:pre-wrap; word-break:break-word; max-height:160px; overflow:hidden; }
  .tt-note { margin-top:6px; font-size:11px; color:rgba(165,180,252,0.85); font-style:italic; border-top:1px solid rgba(255,255,255,0.08); padding-top:5px; white-space:pre-wrap; word-break:break-word; max-height:48px; overflow:hidden; }
</style>
</head>
<body>
<div class="tt-card" id="card">
  <div class="tt-bar" id="bar"></div>
  <div class="tt-head">
    <div class="tt-av" id="av"></div>
    <div class="tt-hcol">
      <span class="tt-sender" id="sender"></span>
      <span class="tt-src" id="meta"></span>
    </div>
  </div>
  <div class="tt-catrow"><span class="tt-cat" id="cat"></span></div>
  <div class="tt-text" id="text"></div>
  <div class="tt-note" id="note" style="display:none"></div>
</div>
<script>
  const card = document.getElementById('card')
  const bar = document.getElementById('bar')
  const av = document.getElementById('av')
  const catEl = document.getElementById('cat')
  const metaEl = document.getElementById('meta')
  const senderEl = document.getElementById('sender')
  const textEl = document.getElementById('text')
  const noteEl = document.getElementById('note')
  const CAT = { urgent: '🔴 Срочно', work: '🟡 В работе', later: '🟢 На потом' }

  window.tooltipApi.onData((d) => {
    const color = d.color || '#2AABEE'
    bar.style.background = color
    senderEl.textContent = d.sender || ''
    // v1.2.70: у картинки без подписи текст пустой → «📷 Фото»
    textEl.textContent = (d.text && d.text.trim()) ? d.text : '📷 Фото'

    // v1.2.75: аватар. Если пришёл icon (cc-media:// или data-url) — картинка;
    // иначе — цветной кружок с первой буквой имени (запасной вид).
    av.innerHTML = ''
    if (d.icon) {
      const img = document.createElement('img')
      img.src = d.icon
      img.onerror = () => { img.remove(); av.style.background = color; av.textContent = (d.sender || '?').trim().charAt(0).toUpperCase() }
      av.style.background = 'transparent'
      av.appendChild(img)
    } else {
      av.style.background = color
      av.textContent = (d.sender || '?').trim().charAt(0).toUpperCase() || '?'
    }

    // категория
    catEl.className = 'tt-cat'
    if (d.category && CAT[d.category]) { catEl.classList.add(d.category); catEl.textContent = CAT[d.category]; catEl.style.display = '' }
    else { catEl.style.display = 'none' }

    // источник: мессенджер · время
    const parts = []
    if (d.messengerName) parts.push(d.messengerName)
    if (d.time) parts.push(d.time)
    metaEl.textContent = parts.join(' · ')

    // заметка
    if (d.note) { noteEl.textContent = '📝 ' + d.note; noteEl.style.display = '' }
    else { noteEl.style.display = 'none' }

    // v1.2.71: размер сообщаем СРАЗУ (offsetHeight форсит раскладку), без rAF —
    // у скрытого окна rAF засыпает и подсказка не показывалась повторно.
    try { window.tooltipApi.resize(card.offsetWidth, card.offsetHeight) } catch (_) {}
  })
</script>
</body>
</html>
